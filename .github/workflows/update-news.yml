name: Mise à jour des actualités

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - scripts/fetch_news.py

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les flux
        run: python scripts/fetch_news.py

      - name: Enregistrer news.json
        run: |
          git config user.name "veille-monde-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Actualités du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
