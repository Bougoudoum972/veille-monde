<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veille Monde</title>
  <meta name="description" content="L'actualité géopolitique, économique et transport du jour, en un seul endroit.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Veille Monde">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="header-top">
        <h1 id="title">À la une</h1>
        <div class="header-actions">
          <button id="refresh" class="icon-btn" type="button" aria-label="Actualiser">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
          <label class="icon-btn" aria-label="Choisir une source">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <select id="source-select"></select>
          </label>
        </div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Pays, entreprise, sujet…" autocomplete="off" enterkeyhint="search">
      </div>
      <nav id="chips" class="chips" aria-label="Thèmes"></nav>
    </header>

    <section id="list" aria-live="polite">
      <p class="status">Chargement des actualités…</p>
    </section>
    <footer id="footer" class="footer"></footer>
  </main>

  <nav class="tabbar" aria-label="Rubriques">
    <a href="#une" data-tab="une">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h4M7 16h4M14 12h3v4h-3z"/></svg>
      <span>À la une</span>
    </a>
    <a href="#geo" data-tab="geo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
      <span>Géopolitique</span>
    </a>
    <a href="#eco" data-tab="eco">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>
      <span>Économie</span>
    </a>
    <a href="#transport" data-tab="transport">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg>
      <span>Transport</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
